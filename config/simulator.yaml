tracing:
  endpoint: 127.0.0.1:4318
  insecure: true

simulator:
  service-name: simulator
  http-addr: 127.0.0.1:8084
  metrics-addr: 127.0.0.1:9106
  consul-addr: 127.0.0.1:8500
  tenant-id: default

resource:
  grpc-addr: 127.0.0.1:5002

gateway:
  # APISIX northbound entry (Phase 1 key-auth). Direct :8083 bypasses auth for local debug.
  http-addr: http://127.0.0.1:9080/gateway
  api-key: vpp-dev-simulator-key

runtime:
  # Device Tick + telemetry ingest interval (was 5s; raised to cut local DB growth).
  tick-interval: 10s
  # Set false to keep in-memory simulation without writing to Gateway/Telemetry.
  publish-enabled: true
  # Emit simulator.tick / simulator.publish spans every N ticks (6 × 10s ≈ 1/min).
  # Set to 1 to trace every tick during debugging.
  trace-sample-every: 6
  # Optional filters. Empty site-ids / cu-ids → load all matching provider.
  site-ids: []
  cu-ids: []
  # Only load CUs whose Provider equals this value. Empty → no provider filter.
  require-provider: simulator

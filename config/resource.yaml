dial-grpc-timeout-seconds: 10

tracing:
  endpoint: 127.0.0.1:4318
  insecure: true

resource:
  service-name: resource

  server-to-run: http

  http-addr: 127.0.0.1:8082
  grpc-addr: 127.0.0.1:5002
  metrics-addr: 127.0.0.1:9102
  consul-addr: 127.0.0.1:8500

  # When true (recommended behind APISIX): require X-Userinfo, enforce tenant + authz.
  # When false: auth bypass for local direct :8082 debugging (do not trust client-forged headers).
  auth:
    trust-proxy-headers: false
    # Local Casbin PDP + Casdoor policy sync (AUTHZ C7). Ignored when trust-proxy-headers is false.
    authz:
      # When trust-proxy-headers is true, Casdoor B1 sync starts automatically.
      casdoor-url: http://127.0.0.1:8000
      casdoor-organization: built-in
      casdoor-application: app-built-in
      casdoor-username: admin
      casdoor-password: "123"
      owner: default
      model-filter: default/vpp-rbac
      snapshot-path: ./data/resource-authz-snapshot.json
      sync-interval: 30s
      healthy-after: 5m
      stale-after: 30m
      allow-read-when-invalid: false
      # C9: upsert AuthzCatalog Permissions (empty Roles); set true to skip.
      # disable-register-catalog: false

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres123
  dbname: resource
  params:
    sslmode: disable
    TimeZone: Asia/Shanghai

  max-open-conns: 50
  max-idle-conns: 10
  conn-max-lifetime-seconds: 1800
  conn-max-idle-time-seconds: 300

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 0
  pool-size: 10
  min-idle-conns: 2
  dial-timeout-seconds: 5
  read-timeout-seconds: 3
  write-timeout-seconds: 3
  ping-timeout-seconds: 3





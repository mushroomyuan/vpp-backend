tracing:
  endpoint: 127.0.0.1:4318
  insecure: true

telemetry:
  service-name: telemetry
  grpc-addr: 127.0.0.1:5003
  metrics-addr: 127.0.0.1:9103
  consul-addr: 127.0.0.1:8500

  # When true: require x-userinfo + Casbin on read RPCs (AUTHZ C10c).
  # IngestTelemetry stays machine-auth (gateway→telemetry) and skips user PEP.
  # When false: auth bypass for local direct :5003 debugging.
  auth:
    trust-proxy-headers: false
    authz:
      casdoor-url: http://127.0.0.1:8000
      casdoor-organization: built-in
      casdoor-application: app-built-in
      casdoor-username: admin
      casdoor-password: "123"
      owner: default
      model-filter: default/vpp-rbac
      snapshot-path: ./data/telemetry-authz-snapshot.json
      sync-interval: 30s
      healthy-after: 5m
      stale-after: 30m
      allow-read-when-invalid: false

# TimescaleDB (PostgreSQL + TimescaleDB extension).
# Keep in sync with compose.yaml → postgres environment.*
timescaledb:
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres123
  dbname: telemetry
  sslmode: disable
  max-conns: 20
  min-conns: 2

redis:
  addr: 127.0.0.1:6379
  password: ""
  db: 1          # db=1 to avoid key collisions with the resource service (db=0)
  pool-size: 10
  min-idle-conns: 2
  dial-timeout-seconds: 5
  read-timeout-seconds: 3
  write-timeout-seconds: 3
  ping-timeout-seconds: 3

kafka:
  brokers:
    - 127.0.0.1:9092
  topic: vpp.soe.events

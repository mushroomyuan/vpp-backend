tracing:
  endpoint: 127.0.0.1:4318
  insecure: true

dispatch:
  service-name: dispatch
  grpc-addr: 127.0.0.1:5006
  metrics-addr: 127.0.0.1:9105
  # Empty: skip Consul. Discovery is YAML / K8s Service DNS.
  consul-addr: ""
  timeout-scan-interval: 10s
  default-command-timeout: 30s
  default-max-retries: 3

  # When true: require x-userinfo metadata + local Casbin PDP (AUTHZ C10a).
  # When false: auth bypass for local direct :5006 debugging.
  auth:
    trust-proxy-headers: false
    authz:
      casdoor-url: http://127.0.0.1:8000
      casdoor-organization: built-in
      casdoor-application: app-built-in
      casdoor-username: admin
      casdoor-password: "123"
      owner: default
      model-filter: default/vpp-rbac
      snapshot-path: ./data/dispatch-authz-snapshot.json
      sync-interval: 30s
      # Control-class thresholds (stricter than resource 5m/30m).
      healthy-after: 1m
      stale-after: 5m
      allow-read-when-invalid: false
      deny-writes-when-stale: true

  # Per-RPC token-bucket rate limiting (see platform/decorator.WithRateLimit).
  # SubmitTask is on now that Optimization calls it on every decision cycle
  # (design plan §9): a loose bucket so a flapping rule cannot stampede
  # dispatch/gateway. CancelTask stays off — it is not on the hot path.
  rate-limit:
    submit-task:
      enabled: true
      rps: 20
      burst: 40
    cancel-task:
      enabled: false
      rps: 20
      burst: 40

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres123
  dbname: dispatch
  params:
    sslmode: disable
    TimeZone: Asia/Shanghai
  max-open-conns: 20
  max-idle-conns: 5
  conn-max-lifetime-seconds: 1800
  conn-max-idle-time-seconds: 300

gateway:
  grpc-addr: 127.0.0.1:5005
  # Outbound-call timeout to gateway; fills the gap when a call has no
  # existing context deadline. Prerequisite for the circuit breaker below.
  timeout: 5s
  # Circuit breaker for dispatch->gateway ExecuteCommand (see
  # platform/resilience). Disabled by default — purely additive, opt in
  # once you have failure-rate signal.
  circuit-breaker:
    enabled: false
    consecutive-failures: 5
    min-requests: 10
    failure-ratio: 0.5
    open-timeout: 30s

kafka:
  brokers:
    - "127.0.0.1:9092"
  command-topic: vpp.command.events
  dispatch-topic: vpp.dispatch.events
  group-id: vpp-dispatch-command-events

tracing:
  endpoint: 127.0.0.1:4318
  insecure: true

gateway:
  service-name: gateway
  grpc-addr: 127.0.0.1:5005
  http-addr: 127.0.0.1:8083
  metrics-addr: 127.0.0.1:9104
  # Empty: skip Consul. Discovery is YAML / K8s Service DNS.
  consul-addr: ""

  # When true: require X-Userinfo + Casbin on mappings routes (AUTHZ C10b).
  # EMS telemetry:ingest stays on APISIX key-auth and is not covered by this PEP.
  # When false: auth bypass for local direct :8083 debugging.
  auth:
    trust-proxy-headers: false
    authz:
      casdoor-url: http://127.0.0.1:8000
      casdoor-organization: built-in
      casdoor-application: app-built-in
      casdoor-username: admin
      casdoor-password: "123"
      owner: default
      model-filter: default/vpp-rbac
      snapshot-path: ./data/gateway-authz-snapshot.json
      sync-interval: 30s
      healthy-after: 5m
      stale-after: 30m
      allow-read-when-invalid: false

database:
  driver: postgres
  host: 127.0.0.1
  port: 5432
  user: postgres
  password: postgres123
  dbname: gateway
  params:
    sslmode: disable
    TimeZone: Asia/Shanghai
  max-open-conns: 20
  max-idle-conns: 5
  conn-max-lifetime-seconds: 1800
  conn-max-idle-time-seconds: 300

telemetry-grpc:
  addr: 127.0.0.1:5003

# Outbound command delivery to vpp-simulator (ExternalSystem = "simulator").
# Leave empty to keep log-only default for all external systems.
simulator:
  addr: http://127.0.0.1:8084

kafka:
  brokers:
    - "127.0.0.1:9092"
  topic: vpp.resource.events
  group-id: vpp-gateway-resource-events
  command-topic: vpp.command.events

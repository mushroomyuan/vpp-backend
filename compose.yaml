
services:
  consul:
    image: hashicorp/consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - 8500:8500
      - 8600:8600/udp

  jaeger:
    image: "jaegertracing/all-in-one:latest"
    ports:
      - "6831:6831"
      - "16686:16686"
      - "14268:14268"
      - "4318:4318"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: true


  prometheus:
    image: prom/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-authz-alerts.yaml:/etc/prometheus/prometheus-authz-alerts.yaml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/config.yaml"]
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki

  # Promtail is EOL (2026-03-02). Alloy tails host logs written by `make run-all`
  # (./data/vpp-logs/<service>.log) and pushes JSON lines to Loki.
  # Use a project-local path (not /tmp): Docker Desktop + WSL bind mounts under
  # /tmp often break after docker restart.
  alloy:
    image: grafana/alloy:v1.8.3
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "12345:12345"
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./data/vpp-logs:/var/log/vpp:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - jaeger


  postgres:
    # TimescaleDB is a PostgreSQL superset: resource service works unchanged;
    # telemetry service requires hypertables (TimescaleDB-specific).
    image: timescale/timescaledb:latest-pg16
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      # Keep in sync with config/resource.yaml  → database.*
      #                  config/telemetry.yaml  → timescaledb.*
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: resource
    volumes:
      - ./migrations/initdb:/docker-entrypoint-initdb.d
      - ./data/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"

  kafka:
    # bitnami/kafka was removed from Docker Hub free tier (Aug 2025).
    # bitnamilegacy keeps the same KAFKA_CFG_* env vars and volume layout.
    image: bitnamilegacy/kafka:4.0.0-debian-12-r10
    restart: on-failure
    ports:
      - "9092:9092"
    environment:
      # KRaft: this node is both controller and broker.
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      # PLAINTEXT is used for both external (host → container) and
      # inter-broker communication. CONTROLLER is internal only.
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      # Advertise 127.0.0.1 so that Go services running on the host can
      # connect via localhost:9092.
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://127.0.0.1:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - ./data/kafka_data:/bitnami/kafka

volumes:
  loki_data:


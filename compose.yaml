version: '3.9'

services:
  consul:
    image: hashicorp/consul
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    ports:
      - 8500:8500
      - 8600:8600/udp

  jaeger:
    image: "jaegertracing/all-in-one:latest"
    ports:
      - "6831:6831"
      - "16686:16686"
      - "14268:14268"
      - "4318:4318"
      - "4317:4317"
    environment:
      COLLECTOR_OTLP_ENABLED: true


  prometheus:
    image: prom/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/:/etc/prometheus/
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"


  postgres:
    # TimescaleDB is a PostgreSQL superset: resource service works unchanged;
    # telemetry service requires hypertables (TimescaleDB-specific).
    image: timescale/timescaledb:latest-pg16
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      # Keep in sync with config/resource.yaml  → database.*
      #                  config/telemetry.yaml  → timescaledb.*
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: resource
    volumes:
      - ./migrations/initdb:/docker-entrypoint-initdb.d
      - ./data/postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: on-failure
    ports:
      - "6379:6379"



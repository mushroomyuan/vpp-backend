syntax = "proto3";

package resourcepb;

option go_package = "github.com/mushroomyuan/vpp-backend/api/resource/proto/gen;resourcepb";

import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "modules/site.proto";
import "modules/resource.proto";
import "modules/cu.proto";
import "modules/point.proto";
import "modules/job.proto";
import "modules/asset.proto";

// ResourceService exposes APIs aligned with the current application layer:
// Site / Asset / CU / Point, resource-tree operations, and import jobs.
service ResourceService {
  rpc CreateSite(CreateSiteRequest) returns (CreateSiteResponse) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/sites"
      body: "*"
    };
  }
  rpc GetSite(GetSiteRequest) returns (Site) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/sites/{ID}"};
  }
  rpc ListSites(ListSitesRequest) returns (ListSitesResponse) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/sites"};
  }
  rpc UpdateSite(UpdateSiteRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/tenants/{TenantID}/sites/{ID}"
      body: "*"
    };
  }
  rpc CreateAsset(CreateAssetRequest) returns (CreateAssetResponse) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/sites/{SiteID}/resources"
      body: "*"
    };
  }
  rpc GetAsset(GetAssetRequest) returns (Asset) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/resources/{ID}"};
  }
  rpc ListAssets(ListAssetsRequest) returns (ListAssetsResponse) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/sites/{SiteID}/resources"};
  }
  rpc UpdateAsset(UpdateAssetRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/tenants/{TenantID}/resources/{ID}"
      body: "*"
    };
  }
  rpc DeleteResource(DeleteResourceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tenants/{TenantID}/resources/{ID}"};
  }
  rpc MoveResource(MoveResourceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/resources/{ResourceID}:move"
      body: "*"
    };
  }
  rpc BatchMoveResources(BatchMoveResourcesRequest) returns (BatchMoveResourcesResponse) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/resources:batchMove"
      body: "*"
    };
  }
  rpc RenameResource(RenameResourceRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/resources/{ResourceID}:rename"
      body: "*"
    };
  }
  rpc ChangeResourceLifecycle(ChangeResourceLifecycleRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/resources/{ResourceID}:changeLifecycle"
      body: "*"
    };
  }
  rpc GetResourceDetail(GetResourceDetailRequest) returns (Resource) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/resources/{ResourceID}/detail"};
  }
  rpc ListChildren(ListChildrenRequest) returns (ListChildrenResponse) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/resources/{ParentID}/children"};
  }
  rpc GetBreadcrumb(GetBreadcrumbRequest) returns (GetBreadcrumbResponse) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/resources/{ResourceID}/breadcrumb"};
  }
  rpc ExportResourceTree(ExportResourceTreeRequest) returns (ExportResourceTreeResponse) {
    option (google.api.http) = {
      get: "/api/tenants/{TenantID}/resources/{RootID}:exportTree"
    };
  }

  rpc CreateCU(CreateCURequest) returns (CreateCUResponse) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/resources/{ParentID}/cus"
      body: "*"
    };
  }
  rpc GetCU(GetCURequest) returns (CU) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/cus/{ID}"};
  }
  rpc ListCUs(ListCUsRequest) returns (ListCUsResponse) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/cus"};
  }
  rpc UpdateCU(UpdateCURequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/tenants/{TenantID}/cus/{ID}"
      body: "*"
    };
  }

  rpc CreatePoint(CreatePointRequest) returns (CreatePointResponse) {
    option (google.api.http) = {
      post: "/api/tenants/{TenantID}/cus/{CUID}/points"
      body: "*"
    };
  }
  rpc GetPoint(GetPointRequest) returns (Point) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/points/{ID}"};
  }
  rpc ListPoints(ListPointsRequest) returns (ListPointsResponse) {
    option (google.api.http) = {get: "/api/tenants/{TenantID}/points"};
  }
  rpc UpdatePoint(UpdatePointRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/api/tenants/{TenantID}/points/{ID}"
      body: "*"
    };
  }
  rpc DeletePoint(DeletePointRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {delete: "/api/tenants/{TenantID}/points/{ID}"};
  }

  rpc GetJob(GetJobRequest) returns (Job) {
    option (google.api.http) = {get: "/api/import-jobs/{ID}"};
  }
  rpc SubmitBatchImport(SubmitBatchRequest) returns (SubmitBatchResponse) {
    option (google.api.http) = {
      post: "/api/import-jobs:submit"
      body: "*"
    };
  }
  rpc RetryJob(RetryJobRequest) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/api/import-jobs/{ID}:retry"
      body: "*"
    };
  }
}

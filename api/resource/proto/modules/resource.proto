syntax = "proto3";

package resourcepb;

option go_package = "github.com/mushroomyuan/vpp-backend/api/resource/proto/gen;resourcepb";

import "google/protobuf/struct.proto";
import "modules/common.proto";
import "modules/error.proto";


// Resource represents the node table entity exposed as "resource" in
// application/business semantics.
message Resource {
  string ID = 1;
  string TenantID = 2;
  string ParentID = 3;
  string DisplayName = 4;
  string Type = 5;
  string SubType = 6;
  ResourceLifecycleStatus LifecycleStatus = 7;
  string Description = 8;
  string Path = 9;
  int32 Depth = 10;
  google.protobuf.Struct Metadata = 11;
}

message MoveResourceRequest {
  string TenantID = 1;
  string ResourceID = 2;
  string NewParentID = 3;
}

message BatchMoveResourcesRequest {
  string TenantID = 1;
  repeated string ResourceIDs = 2;
  string NewParentID = 3;
}

message BatchMoveResourcesResponse {
  int32 MovedCount = 1;
}

message RenameResourceRequest {
  string TenantID = 1;
  string ResourceID = 2;
  string NewName = 3;
}

message ChangeResourceLifecycleRequest {
  string TenantID = 1;
  string ResourceID = 2;
  ResourceLifecycleStatus Status = 3;
}

message GetResourceDetailRequest {
  string TenantID = 1;
  string ResourceID = 2;
}

message ListChildrenRequest {
  string TenantID = 1;
  string ParentID = 2;
  int32 Offset = 3;
  int32 Limit = 4;
}

message ListChildrenResponse {
  repeated Resource Items = 1;
  int32 TotalCount = 2;
  int32 Offset = 3;
  int32 Limit = 4;
}

message GetBreadcrumbRequest {
  string TenantID = 1;
  string ResourceID = 2;
}

message GetBreadcrumbResponse {
  repeated Resource Items = 1;
}

message ExportResourceTreeRequest {
  string TenantID = 1;
  string RootID = 2;
  int32 MaxDepth = 3;
}

message ExportResourceTreeResponse {
  repeated Resource Items = 1;
}

message DeleteResourceRequest {
  string TenantID = 1;
  string ID = 2;
  bool IncludeDescendants = 3;
}

syntax = "proto3";

package resourcepb;

option go_package = "github.com/mushroomyuan/vpp-backend/api/resource/proto/gen;resourcepb";

import "google/protobuf/wrappers.proto";

enum PointAccessMode {
  POINT_ACCESS_MODE_UNSPECIFIED = 0;
  POINT_ACCESS_MODE_READ = 1;
  POINT_ACCESS_MODE_WRITE = 2;
  POINT_ACCESS_MODE_READ_WRITE = 3;
}

message PointSafetyConstraint {
  google.protobuf.DoubleValue MinValue = 1;
  google.protobuf.DoubleValue MaxValue = 2;
  google.protobuf.DoubleValue MaxChangePerSecond = 3;
  int64 Version = 4;
}

message Point {
  string ID = 1;
  string AssetID = 2;
  string CUID = 3;
  string MetricID = 4;
  string ExternalAddress = 5;
  PointAccessMode AccessMode = 6;
  double Scale = 7;
  double Offset = 8;
  bool Enabled = 9;
  int64 Revision = 10;
  PointSafetyConstraint SafetyConstraint = 11;
  reserved 12, 13;
  reserved "CacheKeyAlias", "Runtime";
}

message CreatePointRequest {
  string TenantID = 1;
  string AssetID = 2;
  string CUID = 3;
  string MetricID = 4;
  string ExternalAddress = 5;
  PointAccessMode AccessMode = 6;
  google.protobuf.DoubleValue Scale = 7;
  google.protobuf.DoubleValue Offset = 8;
  bool Enabled = 9;
  PointSafetyConstraint SafetyConstraint = 10;
  reserved 11, 12;
  reserved "SafetyThresholds", "CacheKeyAlias";
}

message CreatePointResponse {
  string PointID = 1;
}

message UpdatePointRequest {
  string TenantID = 1;
  string ID = 2;
  string MetricID = 3;
  string ExternalAddress = 4;
  PointAccessMode AccessMode = 5;
  google.protobuf.DoubleValue Scale = 6;
  google.protobuf.DoubleValue Offset = 7;
  bool Enabled = 8;
  PointSafetyConstraint SafetyConstraint = 9;
  int64 ExpectedRevision = 10;
  reserved 11;
  reserved "CacheKeyAlias";
}

message DeletePointRequest {
  string TenantID = 1;
  string ID = 2;
}

message GetPointRequest {
  string TenantID = 1;
  string ID = 2;
}

message ListPointsRequest {
  string TenantID = 1;
  string SiteID = 2;
  string CUID = 3;
  repeated string MetricIDs = 4;
  google.protobuf.BoolValue Enabled = 5;
  repeated PointAccessMode AccessModes = 6;
  repeated string IDs = 7;
  int32 Offset = 8;
  int32 Limit = 9;
}

message ListPointsResponse {
  repeated Point Points = 1;
}

message PointItem {
  string MetricID = 1;
  string ExternalAddress = 2;
  PointAccessMode AccessMode = 3;
  google.protobuf.DoubleValue Scale = 4;
  google.protobuf.DoubleValue Offset = 5;
  bool Enabled = 6;
  PointSafetyConstraint SafetyConstraint = 7;
  reserved 8, 9;
  reserved "SafetyThresholds", "CacheKeyAlias";
}




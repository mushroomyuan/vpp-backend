syntax = "proto3";

package resourcepb;

option go_package = "github.com/mushroomyuan/vpp-backend/api/resource/proto/gen;resourcepb";

import "google/protobuf/struct.proto";

message RetryPolicy {
  int32 MaxAttempts = 1;
  int32 InitialBackoffMS = 2;
  int32 MaxBackoffMS = 3;
  double BackoffMultiplier = 4;
}

message ConnectionConfig {
  string Host = 1;
  int32 Port = 2;
  int32 Timeout = 3;
  RetryPolicy RetryPolicy = 4;
}

message CU {
  reserved 10, 14; // 10 was ConnStatus; 14 was Runtime. Resource does not store connection or live values.
  reserved "ConnStatus", "Runtime";

  string ID = 1;
  string TenantID = 2;
  string ParentID = 3;
  string Name = 4;
  string Type = 5;
  reserved 6;
  reserved "CapabilityTags";
  google.protobuf.Struct Metadata = 7;
  string Protocol = 8;
  google.protobuf.Struct ProtocolConfig = 9;
  string Provider = 11;
  string ExternalID = 12;
  ConnectionConfig Connection = 13;
}

message CreateCURequest {
  string TenantID = 1;
  string ParentID = 2;
  string Name = 3;
  string Type = 4;
  reserved 5;
  reserved "CapabilityTags";
  google.protobuf.Struct Metadata = 6;
  string Protocol = 7;
  google.protobuf.Struct ProtocolConfig = 8;
  string Provider = 9;
  string ExternalID = 10;
  ConnectionConfig Connection = 11;
  string Description = 12;
}

message CreateCUResponse {
  string CUID = 1;
}

message UpdateCURequest {
  reserved 12; // was ConnStatus — connection state is not part of the resource API
  reserved "ConnStatus";

  string TenantID = 1;
  string ID = 2;
  string Name = 3;
  string Type = 4;
  reserved 5;
  reserved "CapabilityTags";
  google.protobuf.Struct Metadata = 6;
  string Protocol = 7;
  google.protobuf.Struct ProtocolConfig = 8;
  string Provider = 9;
  string ExternalID = 10;
  ConnectionConfig Connection = 11;
}

message GetCURequest {
  string TenantID = 1;
  string ID = 2;
}

message ListCUsRequest {
  string TenantID = 1;
  string SiteID = 2;
  string AssetID = 3;
  string ParentID = 4;
  repeated string CapabilityIDs = 5;
  repeated string IDs = 6;
  string NameLike = 7;
  int32 Offset = 8;
  int32 Limit = 9;
}

message ListCUsResponse {
  repeated CU CUs = 1;
}

message CUItem {
  string ParentID = 1;
  string Name = 2;
  string Type = 3;
  reserved 4;
  reserved "CapabilityTags";
  google.protobuf.Struct Metadata = 5;
  string Protocol = 6;
  google.protobuf.Struct ProtocolConfig = 7;
  string Provider = 8;
  string ExternalID = 9;
  ConnectionConfig Connection = 10;
}

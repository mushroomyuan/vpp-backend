# Scrape the resource service metrics when it runs on the Docker host (not inside Compose).
# Requires `extra_hosts: host.docker.internal:host-gateway` on the prometheus service (see compose.yaml).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: vpp-resource
    metrics_path: /metrics
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:9102"]

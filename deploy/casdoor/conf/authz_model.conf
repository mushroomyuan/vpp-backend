# VPP shared Casbin model (C5).
# Used by Casdoor Model seed and by each service's local Enforcer (C6+).
#
# Request:  sub = VPP role name (admin|operator|viewer|…), obj = catalog resource, act = action
# Catalog:  {service}:{resource}  +  {action}  →  full id {service}:{resource}:{action}
# Example:  (operator, resource:sites, write)
#
# keyMatch2 lets Casdoor/local policies use wildcards (e.g. resource:*).
# Role inheritance (g) is optional; Syncer may load Casdoor nested roles later.

[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && keyMatch2(r.obj, p.obj) && r.act == p.act

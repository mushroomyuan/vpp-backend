# Casdoor backend config (dev). Mounted at /conf/app.conf.
#
# JWT signing uses the Cert entity seeded in init_data.json (fixed DEV RSA key
# under conf/certs/). Do not wipe the casdoor DB casually — that regenerates
# or re-imports certs and can 401 APISIX until JWKS cache is refreshed.
#
# origin uses host.docker.internal so APISIX (in Docker) can reach discovery /
# JWKS / userinfo. Host-side curl to Casdoor UI may use either
# http://127.0.0.1:8000 or http://host.docker.internal:8000.

appname = casdoor
httpport = 8000
runmode = dev
copyrequestbody = true
driverName = postgres
dataSourceName = "user=postgres password=postgres123 host=host.docker.internal port=5432 sslmode=disable dbname=casdoor"
dbName = casdoor
tableNamePrefix =
showSql = false
redisEndpoint =
defaultStorageProvider =
isCloudIntranet = false
authState = "casdoor"
socks5Proxy =
verificationCodeTimeout = 10
initScore = 0
logPostOnly = true
isUsernameLowered = false
origin = http://host.docker.internal:8000
originFrontend = http://host.docker.internal:8000
staticBaseUrl = "https://cdn.casbin.org"
isDemoMode = false
batchSize = 100
showGithubCorner = false
forceLanguage = ""
defaultLanguage = "en"
aiAssistantUrl =
defaultApplication = "vpp-resource"
enableErrorMask = false
enableGzip = true
inactiveTimeoutMinutes =
ldapServerPort = 389
ldapsCertId =
ldapsServerPort = 636
radiusServerPort = 1812
radiusDefaultOrganization = "default"
radiusSecret = "secret"
quota = {"organization": -1, "user": -1, "application": -1, "provider": -1}
logConfig = {"adapter":"file", "filename": "logs/casdoor.log", "maxdays":99999, "perm":"0770"}
# Re-import seed only on empty DB. Idempotent upserts after first boot: make casdoor-init.
initDataNewOnly = true
initDataFile = "/conf/init_data.json"
frontendBaseDir = "../cc_0"

# Dev credentials for Casdoor IdP (Phase 2).
# Applied via conf/init_data.json on first empty casdoor DB boot.
#
# Do not use these secrets in production.

application:
  name: vpp-resource
  organization: default
  client_id: vpp-resource-dev-client
  client_secret: vpp-resource-dev-secret
  grant_types:
    - authorization_code
    - password          # required for make casdoor-token
    - client_credentials
    - refresh_token

cert:
  name: cert-vpp
  # Fixed DEV RSA keypair under conf/certs/jwt.{crt,key} — keeps JWKS stable across restarts.

users:
  - name: admin
    organization: default
    password: vpp-admin-dev
    roles: [admin]
  - name: operator
    organization: default
    password: vpp-operator-dev
    roles: [operator]
  - name: viewer
    organization: default
    password: vpp-viewer-dev
    roles: [viewer]

# Casdoor built-in console (auto-created, not in init_data):
#   organization: built-in
#   user: admin
#   password: 123

#
# APISIX bootstrap config.
# Mounted as a single file (not the whole conf/ dir — APISIX must write nginx.conf in-container).
#
# :9080 — HTTP reverse proxy (Resource / Gateway)
# :9081 — plaintext HTTP/2 (h2c) for native gRPC northbound (Gate 0+)
#
apisix:
  node_listen:
    - port: 9080
    - port: 9081
  enable_http2: true
  enable_ipv6: false
  # Fixed node id avoids APISIX trying to rewrite config.yaml on the host bind-mount.
  id: vpp-dev-apisix-1

deployment:
  role: traditional
  role_traditional:
    config_provider: etcd
  admin:
    allow_admin:
      - 0.0.0.0/0
    admin_listen:
      ip: 0.0.0.0
      port: 9180
    admin_key:
      - name: admin
        key: edd1c9f034335f136f87ad84b625c8f1
        role: admin
  etcd:
    host:
      - "http://etcd:2379"
    prefix: "/apisix"
    timeout: 30

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091

nginx_config:
  error_log: "/dev/stderr"
  error_log_level: "warn"

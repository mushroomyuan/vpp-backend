# Gateway EMS catch-all (Phase 1 key-auth).
# Applied by deploy/apisix/init.sh via Admin API.
# Upstream: kind NodePort 30083 (host.docker.internal from the APISIX container).
#
# Mappings human-admin traffic uses a higher-priority OIDC route
# (see gateway-mappings.yaml). This route covers telemetry:ingest and
# any other /gateway/* paths that remain machine-authenticated.

upstream_id: gateway-backend
upstream:
  type: roundrobin
  nodes:
    host.docker.internal:30083: 1

consumer:
  username: simulator_default
  api_key: vpp-dev-simulator-key   # see conf/consumers.yaml

route:
  name: gateway-proxy
  uri: /gateway/*
  priority: 0
  backend_path: /api/v1/tenants/*
  plugins:
    proxy-rewrite:
      regex_uri:
        - "^/gateway/(.*)"
        - "/$1"
    key-auth: {}
    limit-req:
      rate: 100
      burst: 200
      key: remote_addr
      rejected_code: 429

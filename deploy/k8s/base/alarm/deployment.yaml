apiVersion: apps/v1
kind: Deployment
metadata:
  name: alarm
  labels:
    app.kubernetes.io/name: alarm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alarm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alarm
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: alarm
          image: ghcr.io/mushroomyuan/vpp-backend/alarm:latest
          imagePullPolicy: Always
          args: ["-c", "/etc/vpp/config.yaml"]
          ports:
            - name: http
              containerPort: 8087
          envFrom:
            - configMapRef:
                name: vpp-infra
            - configMapRef:
                name: alarm-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ALARM_HTTP_ADDR
              value: "$(POD_IP):8087"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: postgres-password
            - name: ALARM_AUTH_AUTHZ_CASDOOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: casdoor-password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tzdata
              mountPath: /usr/share/zoneinfo
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tzdata
          hostPath:
            path: /usr/share/zoneinfo
            type: Directory

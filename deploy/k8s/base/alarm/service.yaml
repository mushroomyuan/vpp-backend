apiVersion: v1
kind: Service
metadata:
  name: alarm
  labels:
    app.kubernetes.io/name: alarm
spec:
  # ClusterIP only. v1 does not add kind extraPortMappings.
  # Local: kubectl -n vpp port-forward svc/alarm 8087:8087
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alarm
  ports:
    - name: http
      port: 8087
      targetPort: http

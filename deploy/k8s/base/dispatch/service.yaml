apiVersion: v1
kind: Service
metadata:
  name: dispatch
  labels:
    app.kubernetes.io/name: dispatch
spec:
  # NodePort so compose APISIX can hairpin gRPC via
  # host.docker.internal:30006. In-cluster: dispatch.vpp.svc.cluster.local:5006.
  type: NodePort
  selector:
    app.kubernetes.io/name: dispatch
  ports:
    - name: grpc
      port: 5006
      targetPort: grpc
      nodePort: 30006

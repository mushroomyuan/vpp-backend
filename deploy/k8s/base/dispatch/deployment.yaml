apiVersion: apps/v1
kind: Deployment
metadata:
  name: dispatch
  labels:
    app.kubernetes.io/name: dispatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dispatch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dispatch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: dispatch
          image: ghcr.io/mushroomyuan/vpp-backend/dispatch:latest
          imagePullPolicy: Always
          args: ["-c", "/etc/vpp/config.yaml"]
          ports:
            - name: grpc
              containerPort: 5006
          envFrom:
            - configMapRef:
                name: vpp-infra
            - configMapRef:
                name: dispatch-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: DISPATCH_GRPC_ADDR
              value: "$(POD_IP):5006"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: postgres-password
            - name: DISPATCH_AUTH_AUTHZ_CASDOOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: casdoor-password
          startupProbe:
            grpc:
              port: 5006
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5006
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 5006
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tzdata
              mountPath: /usr/share/zoneinfo
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tzdata
          hostPath:
            path: /usr/share/zoneinfo
            type: Directory

apiVersion: apps/v1
kind: Deployment
metadata:
  name: forecast
  labels:
    app.kubernetes.io/name: forecast
spec:
  # Batch loop has no cross-replica coordination. Extra replicas would
  # recompute the same horizon (UNIQUE keeps the table clean, but burns
  # CPU). Do not scale above 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forecast
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forecast
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: forecast
          image: ghcr.io/mushroomyuan/vpp-backend/forecast:latest
          imagePullPolicy: Always
          args: ["-c", "/etc/vpp/config.yaml"]
          ports:
            - name: grpc
              containerPort: 5007
            - name: http
              containerPort: 8089
          envFrom:
            - configMapRef:
                name: vpp-infra
            - configMapRef:
                name: forecast-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: FORECAST_GRPC_ADDR
              value: "$(POD_IP):5007"
            - name: FORECAST_HTTP_ADDR
              value: "$(POD_IP):8089"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: postgres-password
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tzdata
              mountPath: /usr/share/zoneinfo
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tzdata
          hostPath:
            path: /usr/share/zoneinfo
            type: Directory

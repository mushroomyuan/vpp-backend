apiVersion: v1
kind: Service
metadata:
  name: decision
  labels:
    app.kubernetes.io/name: decision
spec:
  # ClusterIP only. No APISIX route yet.
  # Local: kubectl -n vpp port-forward svc/decision 8088:8088
  #        kubectl -n vpp port-forward svc/decision 5008:5008
  type: ClusterIP
  selector:
    app.kubernetes.io/name: decision
  ports:
    - name: http
      port: 8088
      targetPort: http
    - name: grpc
      port: 5008
      targetPort: grpc

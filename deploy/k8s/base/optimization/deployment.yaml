apiVersion: apps/v1
kind: Deployment
metadata:
  name: optimization
  labels:
    app.kubernetes.io/name: optimization
spec:
  # In-memory cooldown is per process. Do not scale above 1.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: optimization
  template:
    metadata:
      labels:
        app.kubernetes.io/name: optimization
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: optimization
          image: ghcr.io/mushroomyuan/vpp-backend/optimization:latest
          imagePullPolicy: Always
          args: ["-c", "/etc/vpp/config.yaml"]
          ports:
            - name: http
              containerPort: 8088
          envFrom:
            - configMapRef:
                name: vpp-infra
            - configMapRef:
                name: optimization-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: OPTIMIZATION_HTTP_ADDR
              value: "$(POD_IP):8088"
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tzdata
              mountPath: /usr/share/zoneinfo
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tzdata
          hostPath:
            path: /usr/share/zoneinfo
            type: Directory

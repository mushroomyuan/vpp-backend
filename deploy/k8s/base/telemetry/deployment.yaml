apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
  labels:
    app.kubernetes.io/name: telemetry
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: telemetry
          image: ghcr.io/mushroomyuan/vpp-backend/telemetry:latest
          imagePullPolicy: Always
          args: ["-c", "/etc/vpp/config.yaml"]
          ports:
            - name: grpc
              containerPort: 5003
          envFrom:
            - configMapRef:
                name: vpp-infra
            - configMapRef:
                name: telemetry-config
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: TELEMETRY_GRPC_ADDR
              value: "$(POD_IP):5003"
            - name: TIMESCALEDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: postgres-password
            - name: TELEMETRY_AUTH_AUTHZ_CASDOOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vpp-credentials
                  key: casdoor-password
          startupProbe:
            grpc:
              port: 5003
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            grpc:
              port: 5003
            periodSeconds: 10
          readinessProbe:
            grpc:
              port: 5003
            periodSeconds: 5
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
